name: C contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Install compilers, re2c 4.1 and LLVM tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc clang libclang-rt-dev make python3 re2c git ca-certificates llvm
      - uses: actions/checkout@v4
      - name: Verify generated lexer
        run: make -C src check-generated
      - name: Run all contracts with warnings as errors
        run: make -C src -j2 CC=${{ matrix.compiler }} CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror' test
      - name: Build a clean copy without re2c
        run: make test-build-system CC=${{ matrix.compiler }} CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Address, undefined behavior and leak sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make -C src -j2 CC=${{ matrix.compiler }} test-sanitize

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Build and test with the Windows command interpreter
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          mingw32-make SHELL=cmd.exe PYTHON=python CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror" test-core test-build-system
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
